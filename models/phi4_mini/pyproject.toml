[project]
name = "forensic-atomic-phi4-mini"
version = "0.1.0"
description = "Separate environment for the Phi-4-mini thesis experiments"
authors = [{name = "Forensic ATOMIC project"}]
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
ipykernel = ">=6,<8"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3"
matplotlib = ">=3.9,<4"
pydantic = ">=2,<3"

[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
torch = ">=2.4,<3"
transformers = ">=4.57.3,<5"
datasets = ">=4.4.1,<5"
accelerate = ">=1.12,<2"
peft = ">=0.17,<1"
trl = ">=0.20,<0.30"
bitsandbytes = ">=0.46,<1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
